name: Bootstrap Poli-Educa
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar proyecto
        shell: bash
        run: |
          cat .bootstrap/chunk0.txt .bootstrap/chunk1.txt .bootstrap/chunk2.txt .bootstrap/chunk3.txt .bootstrap/chunk4.txt .bootstrap/chunk5.txt .bootstrap/chunk6.txt > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/poli.zip
          unzip -o /tmp/poli.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: cargar prototipo funcional Poli-Educa ajustado a Figma"
          git push
