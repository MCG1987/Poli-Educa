<header class="site-header">
  <div class="container header-inner">
    <a class="brand" routerLink="/" aria-label="Ir al inicio de Poli-Educa">
      <img src="img/logo.svg" alt="Logo Poli-Educa">
      <span>Poli-Educa</span>
    </a>

    <nav class="main-nav" aria-label="Navegación principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/noticias" routerLinkActive="active">Noticias</a>
      <a routerLink="/favoritos" routerLinkActive="active">Favoritos</a>
      <a routerLink="/nosotros" routerLinkActive="active">Nosotros</a>
      <a routerLink="/contacto" routerLinkActive="active">Contacto</a>
    </nav>
  </div>
</header>
